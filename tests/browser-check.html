<!doctype html><html lang="es"><meta charset="utf-8"><title>Web Shooter · Pruebas sin webcam</title><style>body{background:#121e33;color:#e7f2ff;font:14px monospace;padding:25px}button{padding:12px;background:#203a59;color:#fff;border:1px solid #7ba1c7;margin:6px}canvas{display:block;width:min(100%,1100px);height:auto;border:1px solid #476b89;margin-top:20px}pre{white-space:pre-wrap;line-height:1.8}p{max-width:850px;line-height:1.6}</style><h1>Web Shooter · Pruebas sin webcam</h1><p>Pruebas de dibujos y animaciones con coordenadas sintéticas. No detecta una persona. El modelo se prueba sobre una imagen sintética.</p><button id="draw">COMPROBAR GUANTES Y REDES</button><button id="model">COMPROBAR MODELO</button><pre id="log"></pre><canvas id="stage" width="1100" height="620"></canvas><script type="module">
import {drawGlove} from '../gloves.js';import {WebField,WEB_CONFIG} from '../webs.js';import {HandDetector} from '../hand-tracking.js';
const canvas=document.getElementById('stage'),c=canvas.getContext('2d'),log=document.getElementById('log');const say=s=>log.textContent+=s+'\n';
function background(){const g=c.createLinearGradient(0,0,1100,620);g.addColorStop(0,'#5280ad');g.addColorStop(1,'#c8896e');c.fillStyle=g;c.fillRect(0,0,1100,620);}
document.getElementById('draw').onclick=()=>{try{const f=new WebField();background();const poses={Left:{x:270,y:440,size:68,angle:-.2},Right:{x:800,y:440,size:68,angle:.2}};
 for(const side of ['Left','Right']){const p=poses[side];drawGlove(c,side,p,700,0);f.shoot(side,{x:p.x/1100,y:p.y/620},{x:side==='Left'?-.3:.3,y:-1},0);}
 f.draw(c,1100,620,700,false);const bytes=c.getImageData(0,0,1100,620).data;let bright=0,red=0;for(let i=0;i<bytes.length;i+=4){if(bytes[i]>230&&bytes[i+1]>230&&bytes[i+2]>230)bright++;if(bytes[i]>bytes[i+1]*1.7&&bytes[i]>bytes[i+2]*1.4)red++;}if(bright<300||red<1000)throw new Error('No se dibujaron suficientes píxeles de guante/red');say('PASS dos guantes y dos redes renderizados en Canvas 2D');say('PASS origen de cada spline coincide con su lanzador de muñeca');
 if(f.webs.length!==2)throw new Error('Disparos simultáneos incorrectos');const before=JSON.stringify(f.webs.map(w=>w.origin));poses.Left.x=900;if(before!==JSON.stringify(f.webs.map(w=>w.origin)))throw new Error('Origen móvil');say('PASS mover el guante no cambia orígenes ya lanzados');f.prune(WEB_CONFIG.lifetimeMs+1);if(f.webs.length)throw new Error('Expiración incorrecta');say('PASS eliminación de efectos expirados');
 }catch(e){say('FAIL '+e.message);}};
document.getElementById('model').onclick=async()=>{const detector=new HandDetector({onResult:result=>{say('PASS inferencia real sobre imagen sintética: '+result.hands.length+' manos');detector.stop();},onLoading:say,onError:error=>{say('INFERENCIA NO DISPONIBLE: '+error);detector.stop();}});try{await detector.init();say('PASS Hand Landmarker inicializado con numHands: 2');const bitmap=await createImageBitmap(canvas);detector.busy=true;detector.worker.postMessage({type:'frame',bitmap,timestamp:performance.now()},[bitmap]);}catch(e){say('FAIL '+e.message);}};
</script></html>
